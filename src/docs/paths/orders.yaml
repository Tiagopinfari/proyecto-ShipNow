paths:
  /api/orders:
    get:
      summary: Listar todos los pedidos
      description: Devuelve todos los pedidos registrados en el sistema con la referencia de cliente y entrega.
      tags:
        - Orders
      responses:
        '200':
          description: Listado de pedidos obtenido exitosamente
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Order'
        '500':
          description: Error interno del servidor
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

    post:
      summary: Crear un nuevo pedido
      description: |
        Crea un pedido verificando que el cliente exista en la base de datos, que contenga al menos un ítem válido y que el estado/prioridad (si se envían) respeten las constantes del dominio.
        Calcula automáticamente `declaredValue`, `shippingCost` y `total`.
      tags:
        - Orders
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrderInput'
      responses:
        '201':
          description: Pedido creado exitosamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
        '400':
          description: Error de validación (pedido sin ítems, estado inválido o prioridad inválida)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                SinItems:
                  summary: Pedido sin artículos
                  value:
                    status: "error"
                    message: "El pedido debe tener al menos un item"
                    code: "VALIDATION_ERROR"
                EstadoInvalido:
                  summary: Estado o prioridad fuera de los valores permitidos
                  value:
                    status: "error"
                    message: "Estado de pedido inválido"
                    code: "INVALID_STATUS"
        '404':
          description: El cliente especificado no existe en la base de datos
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                status: "error"
                message: "El cliente especificado no existe"
                code: "USER_NOT_FOUND"
        '500':
          description: Error interno del servidor o falta de API Key de envíos
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                status: "error"
                message: "Configuración inválida: falta API Key"
                code: "INTERNAL_SERVER_ERROR"

  /api/orders/{id}:
    get:
      summary: Obtener un pedido por ID
      description: Recupera el detalle de un pedido específico mediante su ObjectId.
      tags:
        - Orders
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
          description: ID único del pedido en MongoDB
          example: "665f1a2b3c4d5e6f7a8b9c10"
      responses:
        '200':
          description: Pedido encontrado exitosamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
        '400':
          description: ID inválido o con formato incorrecto
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                status: "error"
                message: "ID inválido o con formato incorrecto"
                code: "VALIDATION_ERROR"
        '404':
          description: Pedido no encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                status: "error"
                message: "Pedido no encontrado"
                code: "ORDER_NOT_FOUND"
        '500':
          description: Error interno del servidor
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

    put:
      summary: Actualizar un pedido por ID
      description: Actualiza el estado, prioridad o dirección de entrega de un pedido existente.
      tags:
        - Orders
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
          description: ID único del pedido a actualizar
          example: "665f1a2b3c4d5e6f7a8b9c10"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrderUpdateInput'
      responses:
        '200':
          description: Pedido actualizado exitosamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
        '400':
          description: ID con formato inválido o datos de esquema inválidos
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Pedido no encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                status: "error"
                message: "Pedido no encontrado"
                code: "ORDER_NOT_FOUND"
        '500':
          description: Error interno del servidor
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

    delete:
      summary: Eliminar un pedido por ID
      description: Elimina un pedido existente de la base de datos.
      tags:
        - Orders
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
          description: ID único del pedido a eliminar
          example: "665f1a2b3c4d5e6f7a8b9c10"
      responses:
        '200':
          description: Pedido eliminado exitosamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeleteMessageResponse'
              example:
                message: "Pedido eliminado"
        '400':
          description: ID inválido o con formato incorrecto
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Pedido no encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                status: "error"
                message: "Pedido no encontrado"
                code: "ORDER_NOT_FOUND"
        '500':
          description: Error interno del servidor
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
