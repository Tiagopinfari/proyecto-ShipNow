paths:
  /api/users:
    get:
      summary: Listar usuarios con paginación y filtros
      description: Obtiene el listado paginado de usuarios registrados en la base de datos (por defecto `page=1`, `limit=20`, máximo `100`), permitiendo filtrar por rol y correo electrónico.
      tags:
        - Users
      parameters:
        - in: query
          name: page
          required: false
          schema:
            type: integer
            default: 1
            minimum: 1
          description: Número de página a consultar
          example: 1
        - in: query
          name: limit
          required: false
          schema:
            type: integer
            default: 20
            minimum: 1
            maximum: 100
          description: Cantidad máxima de registros por página (máx. 100)
          example: 20
        - in: query
          name: role
          required: false
          schema:
            type: string
            enum: [admin, customer, driver, store, user, cliente, repartidor]
          description: Filtrar usuarios por rol específico
          example: "driver"
        - in: query
          name: email
          required: false
          schema:
            type: string
          description: Filtrar por coincidencia exacta de email
      responses:
        '200':
          description: Lista de usuarios obtenida exitosamente
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/User'
        '500':
          description: Error interno del servidor
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                status: "error"
                message: "Error interno en el servidor"
                code: "INTERNAL_SERVER_ERROR"

    post:
      summary: Crear un nuevo usuario
      description: Registra un nuevo usuario validando campos obligatorios, unicidad de email y que el rol sea válido (no permite crear usuarios con rol 'admin' por esta vía).
      tags:
        - Users
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserInput'
      responses:
        '201':
          description: Usuario creado exitosamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400':
          description: Datos faltantes o rol de usuario inválido
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                DatosFaltantes:
                  summary: Campos obligatorios faltantes
                  value:
                    status: "error"
                    message: "Faltan campos obligatorios para registrar el usuario (firstName, lastName, email, password)"
                    code: "VALIDATION_ERROR"
                RolInvalido:
                  summary: Rol no permitido en las constantes del sistema
                  value:
                    status: "error"
                    message: "Rol de usuario inválido"
                    code: "INVALID_USER_ROLE"
        '403':
          description: Intento de creación de rol administrador restringido
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                status: "error"
                message: "No se puede crear un admin desde este endpoint"
                code: "FORBIDDEN_OPERATION"
        '409':
          description: El correo electrónico ya se encuentra registrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                status: "error"
                message: "El email ya se encuentra registrado"
                code: "CONFLICT_ERROR"
        '500':
          description: Error interno del servidor
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/users/{id}:
    get:
      summary: Obtener un usuario por ID
      description: Busca y devuelve un usuario específico por su ObjectId de MongoDB.
      tags:
        - Users
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
          description: ID único del usuario en MongoDB
          example: "665f1a2b3c4d5e6f7a8b9c01"
      responses:
        '200':
          description: Usuario encontrado exitosamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400':
          description: Formato de ID inválido (CastError)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                status: "error"
                message: "ID inválido o con formato incorrecto"
                code: "VALIDATION_ERROR"
        '404':
          description: Usuario no encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                status: "error"
                message: "Usuario no encontrado"
                code: "USER_NOT_FOUND"
        '500':
          description: Error interno del servidor
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

    put:
      summary: Actualizar un usuario por ID
      description: Modifica los datos de un usuario existente identificado por su ID.
      tags:
        - Users
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
          description: ID único del usuario a actualizar
          example: "665f1a2b3c4d5e6f7a8b9c01"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserUpdateInput'
      responses:
        '200':
          description: Usuario actualizado exitosamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400':
          description: ID con formato inválido o datos de actualización incorrectos
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                status: "error"
                message: "ID inválido o con formato incorrecto"
                code: "VALIDATION_ERROR"
        '404':
          description: Usuario no encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                status: "error"
                message: "Usuario no encontrado"
                code: "USER_NOT_FOUND"
        '500':
          description: Error interno del servidor
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

    delete:
      summary: Eliminar un usuario por ID
      description: Elimina físicamente un usuario de la base de datos según su ID.
      tags:
        - Users
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
          description: ID único del usuario a eliminar
          example: "665f1a2b3c4d5e6f7a8b9c01"
      responses:
        '200':
          description: Usuario eliminado exitosamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeleteMessageResponse'
              example:
                message: "Usuario eliminado"
        '400':
          description: ID inválido o con formato incorrecto
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Usuario no encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                status: "error"
                message: "Usuario no encontrado"
                code: "USER_NOT_FOUND"
        '500':
          description: Error interno del servidor
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/users/{id}/documents:
    post:
      summary: Subir documento o licencia de un usuario (multipart/form-data)
      description: |
        Recibe un archivo mediante `multipart/form-data` en el campo **`file`** y un tipo de documento opcional en **`documentType`** (`user_document`, `driver_license`, `delivery_proof`).
        Verifica que el usuario exista, valida formato (PDF, JPG, JPEG, PNG, WEBP) y tamaño máximo (5 MB), guarda el archivo en la subcarpeta correspondiente de `/uploads` y registra únicamente sus **metadatos** en el array `documents` del usuario.
      tags:
        - Users
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
          description: ID único del usuario en MongoDB
          example: "665f1a2b3c4d5e6f7a8b9c01"
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - file
              properties:
                file:
                  type: string
                  format: binary
                  description: Archivo a subir (formatos permitidos PDF, JPG, JPEG, PNG, WEBP — máx. 5 MB)
                documentType:
                  type: string
                  enum: [user_document, driver_license, delivery_proof]
                  default: user_document
                  description: Tipo de documento asociado al usuario
                  example: "driver_license"
      responses:
        '201':
          description: Documento cargado en disco y metadatos registrados en el usuario exitosamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserDocumentUploadResponse'
        '400':
          description: Error de validación de archivo (archivo faltante, formato no permitido, tamaño excedido o documentType inválido)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                ArchivoFaltante:
                  summary: No se adjuntó archivo en el campo 'file'
                  value:
                    status: "error"
                    message: "El archivo es obligatorio y debe enviarse en el campo \"file\""
                    code: "FILE_REQUIRED"
                TipoArchivoInvalido:
                  summary: Extensión o MIME no permitido
                  value:
                    status: "error"
                    message: "Tipo de archivo no permitido (text/plain). Solo se aceptan PDF, JPG, JPEG, PNG y WEBP"
                    code: "INVALID_FILE_TYPE"
                TamanoExcedido:
                  summary: El archivo supera los 5 MB
                  value:
                    status: "error"
                    message: "El archivo supera el tamaño máximo permitido de 5 MB"
                    code: "FILE_TOO_LARGE"
                TipoDocumentoInvalido:
                  summary: documentType fuera de las constantes DOCUMENT_TYPES
                  value:
                    status: "error"
                    message: "Tipo de documento inválido (\"pasaporte_falso\"). Valores permitidos: user_document, driver_license, delivery_proof"
                    code: "INVALID_DOCUMENT_TYPE"
        '404':
          description: El usuario especificado no existe
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                status: "error"
                message: "Usuario no encontrado"
                code: "USER_NOT_FOUND"
        '500':
          description: Error al guardar el archivo en el servidor
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                status: "error"
                message: "Error al almacenar el archivo en el servidor"
                code: "FILE_STORAGE_ERROR"
