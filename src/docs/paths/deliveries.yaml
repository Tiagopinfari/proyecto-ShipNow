paths:
  /api/deliveries:
    get:
      summary: Listar entregas con paginación y filtros
      description: Obtiene el listado paginado de entregas logísticas (`page=1`, `limit=20` por defecto, máximo `100`), permitiendo filtrar por `status`, `priority`, `driver` y `order`.
      tags:
        - Deliveries
      parameters:
        - in: query
          name: page
          required: false
          schema:
            type: integer
            default: 1
            minimum: 1
          description: Número de página
          example: 1
        - in: query
          name: limit
          required: false
          schema:
            type: integer
            default: 20
            minimum: 1
            maximum: 100
          description: Cantidad máxima de entregas por página (máx. 100)
          example: 20
        - in: query
          name: status
          required: false
          schema:
            type: string
            enum: [pending, assigned, in_transit, delivered]
          description: Filtrar entregas por estado operativo
          example: "delivered"
        - in: query
          name: priority
          required: false
          schema:
            type: string
            enum: [low, normal, high]
          description: Filtrar entregas por prioridad
          example: "normal"
        - in: query
          name: driver
          required: false
          schema:
            type: string
          description: Filtrar entregas por ID del repartidor asignado
        - in: query
          name: order
          required: false
          schema:
            type: string
          description: Filtrar entregas por ID del pedido asociado
      responses:
        '200':
          description: Lista de entregas obtenida exitosamente
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Delivery'
        '500':
          description: Error interno del servidor
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

    post:
      summary: Crear una nueva entrega
      description: |
        Registra una entrega asociada a un pedido existente.
        Si se especifica un `driver`, verifica que el usuario exista y que posea el rol `driver` o `repartidor`.
        También valida que `status` y `priority` correspondan a valores permitidos.
      tags:
        - Deliveries
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeliveryInput'
      responses:
        '201':
          description: Entrega creada exitosamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Delivery'
        '400':
          description: Rol de repartidor inválido o estado/prioridad de entrega no permitidos
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                RolInvalido:
                  summary: El usuario asignado no tiene rol de repartidor
                  value:
                    status: "error"
                    message: "El usuario especificado no posee rol de repartidor/driver"
                    code: "INVALID_USER_ROLE"
                EstadoInvalido:
                  summary: Estado o prioridad de entrega inválido
                  value:
                    status: "error"
                    message: "Estado de entrega inválido"
                    code: "INVALID_STATUS"
        '404':
          description: Pedido o repartidor inexistente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                PedidoNoEncontrado:
                  summary: El pedido indicado no existe
                  value:
                    status: "error"
                    message: "El pedido especificado no existe"
                    code: "ORDER_NOT_FOUND"
                RepartidorNoEncontrado:
                  summary: El repartidor indicado no existe
                  value:
                    status: "error"
                    message: "El repartidor especificado no existe"
                    code: "USER_NOT_FOUND"
        '500':
          description: Error interno del servidor
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/deliveries/{id}:
    get:
      summary: Obtener una entrega por ID
      description: Devuelve los detalles de una entrega específica según su ID de MongoDB.
      tags:
        - Deliveries
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
          description: ID único de la entrega
          example: "665f1a2b3c4d5e6f7a8b9c20"
      responses:
        '200':
          description: Entrega encontrada exitosamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Delivery'
        '400':
          description: ID inválido o con formato incorrecto
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Entrega no encontrada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                status: "error"
                message: "Entrega no encontrada"
                code: "DELIVERY_NOT_FOUND"
        '500':
          description: Error interno del servidor
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

    put:
      summary: Actualizar una entrega por ID
      description: Modifica el estado, prioridad o repartidor asignado de una entrega existente.
      tags:
        - Deliveries
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
          description: ID único de la entrega a actualizar
          example: "665f1a2b3c4d5e6f7a8b9c20"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeliveryUpdateInput'
      responses:
        '200':
          description: Entrega actualizada exitosamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Delivery'
        '400':
          description: ID inválido o datos de actualización incorrectos
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Entrega no encontrada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                status: "error"
                message: "Entrega no encontrada"
                code: "DELIVERY_NOT_FOUND"
        '500':
          description: Error interno del servidor
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

    delete:
      summary: Eliminar una entrega por ID
      description: Elimina un registro de entrega de la base de datos según su ID.
      tags:
        - Deliveries
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
          description: ID único de la entrega a eliminar
          example: "665f1a2b3c4d5e6f7a8b9c20"
      responses:
        '200':
          description: Entrega eliminada exitosamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeleteMessageResponse'
              example:
                message: "Entrega eliminada"
        '400':
          description: ID inválido o con formato incorrecto
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Entrega no encontrada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                status: "error"
                message: "Entrega no encontrada"
                code: "DELIVERY_NOT_FOUND"
        '500':
          description: Error interno del servidor
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/deliveries/{id}/proof:
    post:
      summary: Subir comprobante de entrega (multipart/form-data)
      description: |
        Recibe un archivo de comprobante en el campo **`file`** (`multipart/form-data`), verifica que la entrega exista en MongoDB, almacena el archivo en `uploads/deliveries/proofs` y registra sus metadatos en la entidad `Delivery`.
      tags:
        - Deliveries
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
          description: ID único de la entrega en MongoDB
          example: "665f1a2b3c4d5e6f7a8b9c20"
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - file
              properties:
                file:
                  type: string
                  format: binary
                  description: Imagen o PDF del comprobante de entrega (PDF, JPG, JPEG, PNG, WEBP — máx. 5 MB)
                documentType:
                  type: string
                  enum: [delivery_proof, user_document, driver_license]
                  default: delivery_proof
                  description: Tipo de documento (por defecto delivery_proof)
                  example: "delivery_proof"
      responses:
        '201':
          description: Comprobante cargado y asociado exitosamente a la entrega
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeliveryProofUploadResponse'
        '400':
          description: Archivo faltante, tipo de archivo no permitido, tamaño excedido o documentType inválido
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                ArchivoRequerido:
                  summary: Falta el archivo en el campo 'file'
                  value:
                    status: "error"
                    message: "El archivo es obligatorio y debe enviarse en el campo \"file\""
                    code: "FILE_REQUIRED"
                TipoNoPermitido:
                  summary: Formato de archivo inválido
                  value:
                    status: "error"
                    message: "Tipo de archivo no permitido. Solo se aceptan PDF, JPG, JPEG, PNG y WEBP"
                    code: "INVALID_FILE_TYPE"
        '404':
          description: Entrega no encontrada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                status: "error"
                message: "Entrega no encontrada"
                code: "DELIVERY_NOT_FOUND"
        '500':
          description: Error al guardar el archivo en el servidor
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
