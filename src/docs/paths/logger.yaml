paths:
  /api/loggerTest:
    get:
      summary: Ejecutar prueba de todos los niveles del Logger (Herramienta interna)
      description: |
        **Nota importante:** Este endpoint **no representa una funcionalidad de negocio de ShipNow**, sino una **herramienta interna de validación técnica**.
        Su propósito es disparar secuencialmente logs en los 6 niveles configurados en Winston (`debug`, `http`, `info`, `warning`, `error` y `fatal`) para verificar el formato en consola según el entorno (`NODE_ENV`) y la persistencia selectiva de `error` y `fatal` en `/logs/error.log`.
      tags:
        - Logger
      responses:
        '200':
          description: Prueba de niveles ejecutada correctamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoggerTestResponse'
              example:
                status: "success"
                message: "Logs de prueba ejecutados correctamente en todos los niveles (debug, http, info, warning, error, fatal)"
                levelsTested: ["debug", "http", "info", "warning", "error", "fatal"]
        '500':
          description: Error interno del servidor
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
