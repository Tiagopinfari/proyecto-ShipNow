paths:
  /api/loggerTest:
    get:
      summary: Ejecutar prueba de todos los niveles del Logger (Herramienta interna)
      description: |
        **Nota importante:** Este endpoint **no representa una funcionalidad de negocio de ShipNow**, sino una **herramienta interna de validación técnica**.
        Su propósito es disparar secuencialmente logs en los 6 niveles configurados en Winston (`debug`, `http`, `info`, `warning`, `error` y `fatal`) para verificar el formato en consola según el entorno (`NODE_ENV`) y la persistencia selectiva de `error` y `fatal` en `/logs/error.log`.
      tags:
        - Logger
      responses:
        '200':
          description: Prueba de niveles ejecutada correctamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoggerTestResponse'
              example:
                status: "success"
                message: "Logs de prueba ejecutados correctamente en todos los niveles (debug, http, info, warning, error, fatal)"
                levelsTested: ["debug", "http", "info", "warning", "error", "fatal"]
        '500':
          description: Error interno del servidor
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /loggerTest:
    get:
      summary: Ejecutar prueba del Logger (Alias directo en raíz)
      description: |
        **Nota importante:** Alias directo de `GET /api/loggerTest`. Este endpoint **no representa una funcionalidad de negocio de ShipNow**, sino una **herramienta interna de validación técnica** para disparar y verificar todos los niveles de Winston (`debug`, `http`, `info`, `warning`, `error`, `fatal`).
      tags:
        - Logger
      responses:
        '200':
          description: Prueba de niveles ejecutada correctamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoggerTestResponse'
              example:
                status: "success"
                message: "Logs de prueba ejecutados correctamente en todos los niveles (debug, http, info, warning, error, fatal)"
                levelsTested: ["debug", "http", "info", "warning", "error", "fatal"]
        '500':
          description: Error interno del servidor
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/health:
    get:
      summary: Verificar estado de salud de la API (Health Check)
      description: Herramienta interna de monitoreo que devuelve el estado operativo del servidor, timestamp actual y entorno activo.
      tags:
        - Logger
      responses:
        '200':
          description: Servidor operativo
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: "ok"
                  timestamp:
                    type: string
                    format: date-time
                    example: "2026-11-07T15:00:00.000Z"
                  environment:
                    type: string
                    example: "development"
                  secret:
                    type: string
                    example: "mi_clave_secreta"

  /health:
    get:
      summary: Verificar estado de salud del servidor (Alias Health Check)
      description: Alias directo en raíz para consultar el estado operativo del servidor y el entorno activo.
      tags:
        - Logger
      responses:
        '200':
          description: Servidor operativo
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: "ok"
                  timestamp:
                    type: string
                    format: date-time
                    example: "2026-11-07T15:00:00.000Z"
                  environment:
                    type: string
                    example: "development"
